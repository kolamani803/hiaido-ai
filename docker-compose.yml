services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hiaido
      POSTGRES_USER: hiaido
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - hiaido-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiaido -d hiaido"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hiaido-postgres:
