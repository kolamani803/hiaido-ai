services:
  - type: web
    name: hiaido-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: HiAIDo Administrator
      - key: DEFAULT_TENANT_ID
        value: hiaido-primary
      - key: CORS_ORIGINS
        value: https://kolamani803.github.io
      - key: TOKEN_TTL_HOURS
        value: "8"
      - key: ONTAP_VERIFY_TLS
        value: "true"
