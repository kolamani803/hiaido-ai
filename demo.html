<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>HiAIDo.ai | Interactive Demo</title><link rel="stylesheet" href="./app.css?v=demo2"><style>
.demo-banner{margin:18px 0;padding:14px 18px;border:1px solid #d9a441;border-radius:12px;background:#fff8e8;color:#694b12;font-size:13px}.demo-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.demo-kpis article,.demo-card{background:var(--card,#fff);border:1px solid var(--line,#e5e9ef);border-radius:14px;padding:18px}.demo-kpis strong{display:block;font-size:30px;margin:10px 0}.demo-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.demo-row{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line,#e5e9ef)}.demo-row:last-child{border:0}.demo-row small{display:block;opacity:.65;margin-top:5px}.demo-modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.demo-modules button{text-align:left;padding:16px;border:1px solid var(--line,#e5e9ef);border-radius:12px;background:var(--card,#fff);cursor:pointer}.demo-modules button b,.demo-modules button small{display:block}.demo-modules button small{opacity:.65;margin-top:7px}.demo-active{outline:2px solid #6386bd}.demo-side{background:#14243a;color:white;border-radius:16px;padding:22px}.demo-side button{margin-top:16px}@media(max-width:850px){.demo-layout{grid-template-columns:1fr}.demo-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.demo-modules{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="./demo.html"><span class="brandmark">H</span><span>HiAIDo<span class="dot">.</span><small>OPERATIONS CLOUD</small></span></a><div class="workspace"><span>◆</span><div><small>WORKSPACE</small><b>Enterprise Demo</b></div></div><div class="navscroll" id="demo-nav"></div><div class="sidebarfoot"><div class="side-status"><i></i><span><b>Interactive demo</b><small>Sample data · Read only</small></span></div></div></aside><main class="main"><header class="topbar"><div class="crumb"><span>Workspace</span><b>/</b><strong id="demo-crumb">Command center</strong></div><div class="top-actions"><span class="chip warn">DEMO · READ ONLY</span></div></header><div class="content" id="demo-content"></div><footer class="footer"><span>HiAIDo.ai · Build and Ops with AI</span><span>Demo data only · No sign-in required</span><a class="link" href="./index.html">Organization login</a></footer></main></div>
<script>
const groups=[['WORKSPACE',[['overview','Command center'],['services','Service catalog'],['projects','Projects & applications']]],['BUILD',[['devstudio','AI development studio'],['architecture','Architecture designer'],['deployments','Deployment center'],['changes','Change intelligence'],['assets','IT asset inventory'],['selfservice','Self-service IT portal']]],['OPERATE',[['infrastructure','Infrastructure explorer'],['incidents','Incident management'],['observability','Observability & SLOs'],['runbooks','Runbooks'],['terminal','Engineering workbench']]],['AUTOMATE',[['automation','Automation studio'],['agents','AI agent factory'],['marketplace','Agent marketplace']]],['CONNECT',[['integrations','Integrations & MCP'],['knowledge','Knowledge hub']]],['INTELLIGENCE',[['copilot','AI operations copilot'],['digitaltwin','Infrastructure digital twin'],['predictive','Predictive operations'],['finops','FinOps & capacity'],['security','Security & compliance'],['analytics','Operational analytics'],['dashboards','Dashboard builder']]],['GOVERNANCE',[['tasks','Work queue'],['approvals','Approvals'],['audit','Audit trail'],['admin','Administration']]]];
const data={overview:[['Managed services','24','Sample service catalog'],['Open incidents','3','Illustrative incidents'],['Integrations','6','Sample connectors'],['Pending approvals','2','Governance queue']],services:[['Customer API','Platform Engineering','Healthy','Critical'],['Payments service','Digital Commerce','Healthy','High'],['Identity gateway','Security Engineering','Degraded','Critical']],projects:[['Cloud modernization','Infrastructure','In progress','High'],['Developer portal','Platform','Planning','Normal']],incidents:[['INC-2048 · API latency elevated','SRE','Investigating','High'],['INC-2047 · Storage threshold','Cloud Ops','Mitigated','Medium'],['INC-2046 · Build queue delay','Developer Experience','Resolved','Low']],deployments:[['Payments API · v2.8.1','Release Engineering','Awaiting approval','High'],['Portal UI · v1.14','Platform','Succeeded','Normal']],changes:[['CHG-882 · Kubernetes upgrade','Infrastructure','Pending review','High'],['CHG-881 · Rotate service cert','Security','Approved','Normal']],assets:[['ocp-prod-01','Platform Engineering','Managed','Critical'],['ontap-cluster-a','Storage','Managed','High']],approvals:[['CHG-882 · Cluster upgrade','Change Advisory','Pending approval','High'],['New MCP connector · NetApp','Platform Admin','Pending approval','Normal']],tasks:[['Review production SLO breach','SRE','Open','High'],['Validate backup evidence','Storage','In progress','Normal']],runbooks:[['OpenShift node not ready','SRE','Published','High'],['ONTAP volume capacity check','Storage','Published','Normal']],agents:[['Incident triage assistant','SRE','Draft','High'],['Change risk assessor','Platform','Published','Normal']],automation:[['Kubernetes namespace request','Platform','Draft','Normal'],['Daily backup verification','Storage','Enabled','High']],integrations:[['OpenShift API','Kubernetes','Registered · demo','Read-only'],['NetApp ONTAP','Storage','Registered · demo','Read-only'],['ServiceNow','ITSM','Not connected','—']],security:[['Privileged access review','Security','In progress','High'],['Cluster baseline controls','Platform','Compliant','Normal']],knowledge:[['Production support standards','Platform','Published','Normal'],['Disaster recovery guide','SRE','Published','High']]};
const desc={devstudio:'Design code, Kubernetes manifests, CI/CD pipelines and tests.',architecture:'Map application architecture, dependencies and technical decisions.',observability:'Explore service-level objectives, alerts and reliability signals.',terminal:'Secure engineering workbench preview. Remote sessions are disabled in demo.',copilot:'AI-assisted operational guidance preview. Live model access is not configured.',digitaltwin:'Model infrastructure assets and service dependencies.',predictive:'Capacity and anomaly forecasting preview.',finops:'Cloud cost allocation and capacity management preview.',analytics:'Cross-module operational reporting preview.',dashboards:'Build operational dashboards from connected data.',marketplace:'Discover reusable agent templates and capabilities.',selfservice:'Publish governed IT request templates.',infrastructure:'Explore Kubernetes, storage and cloud inventory.',audit:'Review governance and operational evidence.'};
function openPage(id){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.getElementById('demo-crumb').textContent=(groups.flatMap(g=>g[1]).find(x=>x[0]===id)||[id,id])[1];const v=document.getElementById('demo-content');const rows=data[id]||[['Preview workspace','Platform Operations','Available in configured environment','Normal'],['Connected provider required','Infrastructure','Not connected','Info']];const isHome=id==='overview';let body=isHome?'<div class="demo-kpis">'+data.overview.map(x=>'<article><div>'+x[0]+'</div><strong>'+x[1]+'</strong><small>'+x[2]+'</small></article>').join('')+'</div>':'';body+='<div class="demo-layout"><section class="demo-card"><div class="cardhead"><div><h2>'+((groups.flatMap(g=>g[1]).find(x=>x[0]===id)||[id,id])[1])+'</h2><p>'+ (desc[id]||'Illustrative enterprise records for exploring the HiAIDo workspace.')+'</p></div></div>'+rows.map(r=>'<div class="demo-row"><div><b>'+r[0]+'</b><small>'+r[1]+' · Sample record</small></div><span class="chip warn">'+r[2]+'</span></div>').join('')+'</section><aside class="demo-side"><div class="copilotlabel">✳ HIAIDO INTELLIGENCE</div><h2>Build and operate with AI.</h2><p>One workspace for engineering, infrastructure, automation and operational intelligence.</p><p><b>Platform readiness</b></p><div class="demo-row"><span>Database</span><b>Configured</b></div><div class="demo-row"><span>AI gateway</span><b>Not configured</b></div><div class="demo-row"><span>MCP workers</span><b>Not configured</b></div></aside></div><div class="demo-banner"><b>Demo environment:</b> all records shown are fictional examples. No organization systems are connected, and actions are disabled in this read-only preview.</div><h2>Explore workspace modules</h2><div class="demo-modules">'+groups.flatMap(g=>g[1]).map(x=>'<button data-open="'+x[0]+'" class="'+(x[0]===id?'demo-active':'')+'"><b>'+x[1]+'</b><small>Open module preview →</small></button>').join('')+'</div>';v.innerHTML='<div class="heading"><div><div class="eyebrow">HIAIDO ENTERPRISE WORKSPACE</div><h1>'+((groups.flatMap(g=>g[1]).find(x=>x[0]===id)||[id,id])[1])+'</h1><p>Enterprise build and operations workspace preview</p></div><span class="chip warn">DEMO MODE</span></div>'+body;}
const nav=document.getElementById('demo-nav');nav.innerHTML=groups.map(g=>'<div class="navgroup"><label>'+g[0]+'</label>'+g[1].map(x=>'<button class="nav '+(x[0]==='overview'?'active':'')+'" data-id="'+x[0]+'"><i>◫</i>'+x[1]+'</button>').join('')+'</div>').join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-id],[data-open]');if(b)openPage(b.dataset.id||b.dataset.open)});openPage('overview');
</script></body></html>
